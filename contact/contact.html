<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お問い合わせ</title>
  <link rel="stylesheet" href="contact-style.css" />
</head>
<body>

  <div class="page">
    <div class="page-hero">
      <div class="hero-eyebrow">
        <span class="hero-eyebrow-dot"></span>
        Contact
      </div>
      <p class="hero-title">お問い合わせ</p>
      <div class="hero-divider"></div>
      <p class="hero-desc">
        大会についてのご質問は、下記フォームよりお問い合わせ下さい。<br>
        内容を確認の上、担当者よりご連絡いたします。
      </p>
    </div>

    <div class="form-card">
      <form id="cf-form" action="send.php" method="POST">

        <div class="cf-group">
          <div class="cf-label-row">
            <label class="cf-label" for="cf-name">氏名（チーム名）</label>
            <span class="cf-badge">必須</span>
          </div>
          <input class="cf-input" id="cf-name" name="name" type="text" autocomplete="name" />
        </div>

        <div class="cf-group">
          <div class="cf-label-row">
            <label class="cf-label" for="cf-tel">連絡先電話番号</label>
            <span class="cf-badge">必須</span>
          </div>
          <input class="cf-input" id="cf-tel" name="tel" type="tel" autocomplete="tel" />
        </div>

        <div class="cf-group">
          <div class="cf-label-row">
            <label class="cf-label" for="cf-email">メールアドレス</label>
            <span class="cf-badge">必須</span>
          </div>
          <input class="cf-input" id="cf-email" name="email" type="email" autocomplete="email" />
        </div>

        <div class="cf-group">
          <div class="cf-label-row">
            <label class="cf-label" for="cf-tournament">参加大会名</label>
            <span class="cf-badge">必須</span>
          </div>
          <input class="cf-input" id="cf-tournament" name="tournament" type="text" />
        </div>

        <div class="cf-group">
          <div class="cf-label-row">
            <label class="cf-label" for="cf-event">参加種目名</label>
            <span class="cf-badge">必須</span>
          </div>
          <input class="cf-input" id="cf-event" name="event" type="text" />
        </div>

        <div class="cf-group">
          <div class="cf-label-row">
            <label class="cf-label" for="cf-message">問い合わせ内容</label>
            <span class="cf-badge">必須</span>
          </div>
          <textarea class="cf-textarea" id="cf-message" name="message"></textarea>
        </div>

        <div class="cf-footer">
          <button class="cf-btn" type="submit" onclick="return handleSubmit()">
            送信する
            <svg width="15" height="15" viewBox="0 0 14 14" fill="none">
              <path d="M2 7h10M8 3l4 4-4 4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

      </form>

      <div class="cf-success" id="cf-success">
        <div class="cf-success-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M4 12l6 6 10-10" stroke="#3B6D11" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="cf-success-title">送信が完了しました</p>
        <p class="cf-success-msg">内容を確認の上、担当者よりご連絡いたします。</p>
      </div>
    </div>
  </div>

<script>
function handleSubmit() {
  var fields = [
    { id: 'cf-name',       label: '氏名（チーム名）' },
    { id: 'cf-tel',        label: '連絡先電話番号' },
    { id: 'cf-email',      label: 'メールアドレス' },
    { id: 'cf-tournament', label: '参加大会名' },
    { id: 'cf-event',      label: '参加種目名' },
    { id: 'cf-message',    label: '問い合わせ内容' }
  ];

  var hasError = false;

  fields.forEach(function(f) {
    var el = document.getElementById(f.id);
    el.classList.remove('error');

    if (!el.value.trim()) {
      el.classList.add('error');
      hasError = true;
    }
  });

  if (hasError) {
    alert('必須項目をすべて入力してください。');
    return false;
  }

  return true;
}
</script>

</body>
</html>
